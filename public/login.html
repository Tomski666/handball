<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Anmelden · OTV C-Jugend</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-seite">
  <div class="login-box">
    <img src="/img/otv-logo-180.png" alt="Logo Ohligser Turnverein 1888">
    <p class="unterzeile">Elternbereich</p>
    <h1>OTV männliche C-Jugend</h1>
    <p class="leise">Nur für Eltern der Mannschaft. Das Passwort steht in der Eltern-WhatsApp-Gruppe.</p>
    <form id="login">
      <label for="pw">Passwort</label>
      <input id="pw" type="password" autocomplete="current-password" required autofocus>
      <button class="knopf" type="submit">Anmelden</button>
      <div class="login-fehler" id="fehler" role="alert"></div>
    </form>
  </div>
  <script src="/login.js"></script>
</body>
</html>
